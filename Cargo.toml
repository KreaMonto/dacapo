[workspace]
resolver = "2"
members = ["crates/dacapo-core", "src-tauri"]

[workspace.package]
# The single source of the app version: Tauri reads it from here (there is
# no "version" in tauri.conf.json), and the About dialog shows it.
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
crc32fast = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
