[workspace]
resolver = "2"
members = ["crates/dacapo-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
crc32fast = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
