<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Renderer Preview</title>
  <link rel="stylesheet" href="../src/styles.css">
  <style>body { display: block; overflow: auto; } .sheet { margin: 24px; }</style>
</head>
<body>
  <!-- Development only: renders a hand-made DocView with render.js, no Tauri needed.
       Serve the repository root over HTTP and open /dev/preview.html. -->
  <div class="sheet"><div id="score" class="score"></div></div>
  <script type="module">
    import { renderScore } from '../src/render.js';
    let id = 1;
    const n = (step, octave, base = 'Quarter', alter = 0, dots = 0) =>
      ({ id: id++, duration: { base, dots }, kind: { chord: { pitches: [{ step, alter, octave }] } } });
    const chord = (ps, base = 'Half') =>
      ({ id: id++, duration: { base, dots: 0 }, kind: { chord: { pitches: ps.map(([step, octave]) => ({ step, alter: 0, octave })) } } });
    const r = (base) => ({ id: id++, duration: { base, dots: 0 }, kind: 'rest' });
    const cell = (v0 = [], v1 = []) => ({ voices: [v0, v1, [], []] });
    const treble = [
      cell([n('C', 5), n('B', 4), n('F', 4, 'Quarter', 1), n('G', 4, 'Eighth'), n('A', 4, 'Eighth')]),
      cell([n('E', 5, 'Half', 0, 1), r('Quarter')]),
      cell([chord([['C', 4], ['E', 4], ['G', 4]]), n('C', 6, 'Sixteenth'), n('D', 6, 'Sixteenth'), n('B', 5, 'Eighth'), r('Eighth'), r('Sixteenth'), r('Sixteenth')]),
      cell([n('G', 5)], [n('E', 4, 'Half'), n('D', 4)]),
      cell([n('B', 4, 'Whole')]),
      cell([n('A', 4), n('A', 4), n('A', 4), n('A', 4), n('A', 4)]),
      cell([]), cell([]), cell([]), cell([]),
    ];
    const bass = [
      cell([r('Whole')]), cell([n('C', 3, 'Half'), n('G', 2, 'Half')]), cell([n('E', 2, 'Whole')]),
      cell([n('B', 3), n('A', 3), n('G', 3), n('F', 3)]), cell([r('Half'), r('Half')]),
      cell([]), cell([]), cell([]), cell([]), cell([]),
    ];
    const measures = Array.from({ length: 10 }, (_, i) => ({
      time: i < 6 ? { beats: 4, beat_type: 4 } : { beats: 3, beat_type: 4 },
      key: { fifths: i < 4 ? 1 : -3 },
    }));
    const view = {
      id: 'x', name: 'Preview', caret: { staff: 0, measure: 1, voice: 0, index: 1 },
      selection: { staff_lo: 0, staff_hi: 1, voice: 0, start: { measure: 2, tick: 0 }, end: { measure: 3, tick: 1920 } },
      score: {
        metadata: { title: 'Preview', composer: '' }, measures,
        staves: [{ id: 1, name: 'RH', clef: 'treble', measures: treble }, { id: 2, name: 'LH', clef: 'bass', measures: bass }],
      },
    };
    const el = document.getElementById('score');
    const draw = () => { el.innerHTML = renderScore(view, el.clientWidth).svg; };
    draw();
    addEventListener('resize', draw);
  </script>
</body>
</html>
