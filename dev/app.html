<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>App Preview</title>
  <link rel="stylesheet" href="../src/styles.css">
</head>
<body>
  <!-- Development only: runs the real frontend (src/index.html + app.js)
       against an in-memory fake backend, so the UI can be tried in a normal
       browser. The fake supports only a few actions and none of the real
       rules; the Rust core is the reference. -->
  <script type="module">
    const html = await (await fetch('../src/index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script').forEach((s) => s.remove());
    document.body.innerHTML = doc.body.innerHTML;

    const STEPS = 'CDEFGAB';
    const SHARPS = 'FCGDAEB';
    let nextId = 1;
    const blank = () => ({ voices: [[], [], [], []] });
    const view = {
      id: 'dev', name: 'Dev preview', path: null, dirty: false, can_undo: false, can_redo: false,
      protected: true, warning: null, selection: null, issues: [],
      caret: { staff: 0, measure: 0, voice: 0, index: 0 },
      score: {
        metadata: { title: 'Dev preview', composer: '' },
        measures: Array.from({ length: 8 }, () => ({ time: { beats: 4, beat_type: 4 }, key: { fifths: 1 } })),
        staves: [
          { id: 1, name: 'RH', clef: 'treble', measures: Array.from({ length: 8 }, blank) },
          { id: 2, name: 'LH', clef: 'bass', measures: Array.from({ length: 8 }, blank) },
        ],
      },
    };
    // Measures 3–6 start as whole-measure rests, to show multi-measure rests.
    for (const st of view.score.staves) {
      for (let m = 2; m <= 5; m++) st.measures[m].voices[0] = [{ id: nextId++, duration: { base: 'Whole', dots: 0 }, kind: 'rest' }];
    }
    // `?theme=light|dark` forces the theme (for screenshots).
    const forcedTheme = new URLSearchParams(location.search).get('theme');
    if (forcedTheme) try { localStorage.setItem('partita.theme', JSON.stringify(forcedTheme)); } catch {}
    // `?demo`: a short piano piece instead, for screenshots of the app.
    if (new URLSearchParams(location.search).has('demo')) {
      const n = (s, base, extra = {}) => {
        const ps = s.split(',').map((x) => ({ step: x[0], alter: x.includes('#') ? 1 : 0, octave: Number(x.at(-1)) }));
        return { id: nextId++, duration: { base, dots: extra.dots || 0 }, kind: { chord: { pitches: ps } }, ...extra, dots: undefined };
      };
      const r = (base) => ({ id: nextId++, duration: { base, dots: 0 }, kind: 'rest' });
      const cell = (events) => ({ voices: [events, [], [], []] });
      const E = 'Eighth', S = 'Sixteenth', Q = 'Quarter', H = 'Half', W = 'Whole';
      const rh = [
        [n('G4', E, { dynamic: 'mp' }), n('B4', E), n('D5', E), n('G5', E), n('F#5', Q, { articulations: ['tenuto'], texts: [{ kind: 'expression', text: 'dolce' }] }), n('E5', Q)],
        [n('D5', Q, { dots: 1 }), n('C5', E), n('B4', S), n('C5', S), n('D5', E), n('G4', Q)],
        [n('B4,D5,G5', H), r(Q), n('A4', E), n('B4', E)],
        [n('C5', E, { articulations: ['staccato'], dynamic: 'f' }), n('E5', E, { articulations: ['staccato'] }), n('A5', E, { articulations: ['staccato'] }), n('G5', E, { articulations: ['staccato'] }), n('F#5', S), n('E5', S), n('D5', S), n('C5', S), n('B4', Q, { articulations: ['accent'] })],
        [n('A4', H, { tie: true }), n('A4', Q), n('C5', E), n('F#4', E)],
        [n('G4,B4,D5', W, { articulations: ['fermata'] })],
      ];
      const lh = [
        [n('G2,D3', H), n('G2,D3', H)],
        [n('G2', Q), n('B2', Q), n('D3', Q), n('B2', Q)],
        [n('G2,D3', W)],
        [n('A2', E), n('E3', E), n('A3', E), n('E3', E), n('D3', H)],
        [n('D2', Q), n('A2', Q), n('D3', H)],
        [n('G2,D3,G3', W)],
      ];
      view.name = 'Morning Song';
      view.score.metadata = { title: 'Morning Song', composer: 'Partita demo' };
      view.score.measures = rh.map(() => ({ time: { beats: 4, beat_type: 4 }, key: { fifths: 1 } }));
      view.score.tempo = 76;
      view.score.measures[0].tempo = { text: 'Andante con moto', bpm: null, beat: 'Quarter', show_text: true, show_metronome: true };
      view.score.measures[3].rehearsal = 'A';
      view.score.staves[0].measures = rh.map(cell);
      view.score.staves[1].measures = lh.map(cell);
      view.score.slurs = [
        { id: 900, start: rh[0][0].id, end: rh[0][3].id },
        { id: 901, start: rh[1][0].id, end: rh[1][5].id },
      ];
      view.caret = { staff: 0, measure: 2, voice: 0, index: 1 };
    }
    const undo = [];
    // Like Document::insert_event: writing into a measure rest replaces it.
    const replaceMeasureRest = (at) => {
      const v = voiceOf(at);
      if (v.length === 1 && v[0].kind === 'rest' && v[0].duration.base === 'Whole') { v.length = 0; at.index = 0; }
    };
    const alter = (m, step) => {
      const f = view.score.measures[m].key.fifths;
      if (f > 0 && SHARPS.slice(0, f).includes(step)) return 1;
      if (f < 0 && SHARPS.slice(7 + f).includes(step)) return -1;
      return 0;
    };
    const voiceOf = (c) => view.score.staves[c.staff].measures[c.measure].voices[c.voice];
    const snapshot = () => undo.push(JSON.stringify([view.score, view.caret]));
    const handlers = {
      set_accidental_at({ id, pitch, alter }) {
        snapshot();
        for (const st of view.score.staves) for (const m of st.measures) for (const v of m.voices) {
          const i = v.findIndex((e) => e.id === id);
          if (i < 0 || v[i].kind === 'rest') continue;
          const ps = v[i].kind.chord.pitches;
          const only = pitch && ps.length > 1 ? pitch : null;
          v[i].kind.chord.pitches = ps.map((q) => (only && !(q.step === only.step && q.octave === only.octave) ? q : { ...q, alter }));
          view.caret = { ...view.caret, index: i + 1 };
        }
      },
      move_pitch({ id, pitch, steps }) {
        snapshot();
        const shift = (q) => { const d = q.octave * 7 + STEPS.indexOf(q.step) + steps; return { ...q, step: STEPS[((d % 7) + 7) % 7], octave: Math.floor(d / 7) }; };
        for (const st of view.score.staves) for (const m of st.measures) for (const v of m.voices) {
          const i = v.findIndex((e) => e.id === id);
          if (i < 0 || v[i].kind === 'rest') continue;
          const ps = v[i].kind.chord.pitches;
          const only = pitch && ps.length > 1 ? pitch : null;
          v[i].kind.chord.pitches = ps.map((q) => (only && !(q.step === only.step && q.octave === only.octave) ? q : shift(q)));
          view.caret = { ...view.caret, index: i + 1 };
        }
      },
      erase({ targets }) {
        snapshot();
        for (const { id, pitch } of targets) {
          for (const st of view.score.staves) for (const m of st.measures) for (const v of m.voices) {
            const i = v.findIndex((e) => e.id === id);
            if (i < 0) continue;
            const ps = v[i].kind.chord?.pitches;
            const keep = pitch && ps ? ps.filter((q) => !(q.step === pitch.step && q.octave === pitch.octave)) : [];
            if (keep.length && keep.length < ps.length) v[i].kind.chord.pitches = keep;
            else v.splice(i, 1);
          }
        }
      },
      place_note({ at, step, octave, duration }) {
        snapshot();
        replaceMeasureRest(at);
        voiceOf(at).splice(at.index, 0, { id: nextId++, duration: { ...duration }, kind: { chord: { pitches: [{ step, octave, alter: alter(at.measure, step) }] } } });
        view.caret = { ...at, index: at.index + 1 };
      },
      // Keyboard entry, roughly like the core: nearest octave to the previous note.
      insert_note({ step, duration }) {
        const prev = voiceOf(view.caret)[view.caret.index - 1]?.kind.chord?.pitches.at(-1) || { step: 'B', octave: 4 };
        const di = (s, o) => o * 7 + STEPS.indexOf(s);
        const octave = [prev.octave - 1, prev.octave, prev.octave + 1]
          .sort((a, b) => Math.abs(di(step, a) - di(prev.step, prev.octave)) - Math.abs(di(step, b) - di(prev.step, prev.octave)))[0];
        handlers.place_note({ at: { ...view.caret }, step, octave, duration });
      },
      add_to_chord({ step }) {
        const index = view.caret.index - 1;
        const e = voiceOf(view.caret)[index];
        if (!e || e.kind === 'rest') return;
        const top = e.kind.chord.pitches.at(-1);
        const octave = STEPS.indexOf(step) <= STEPS.indexOf(top.step) ? top.octave + 1 : top.octave;
        handlers.add_pitch({ at: { ...view.caret, index }, step, octave });
      },
      place_rest({ at, duration }) {
        snapshot();
        replaceMeasureRest(at);
        voiceOf(at).splice(at.index, 0, { id: nextId++, duration: { ...duration }, kind: 'rest' });
        view.caret = { ...at, index: at.index + 1 };
      },
      add_pitch({ at, step, octave }) {
        snapshot();
        const e = voiceOf(at)[at.index];
        const p = { step, octave, alter: alter(at.measure, step) };
        if (e.kind === 'rest') e.kind = { chord: { pitches: [p] } };
        else e.kind.chord.pitches.push(p);
        view.caret = { ...at, index: at.index + 1 };
      },
      set_caret({ caret }) { view.caret = caret; },
      set_tempo({ bpm }) { snapshot(); view.score.tempo = bpm; },
      // Marks act on the event before the caret (the fake has no selections).
      // Clef from the caret's measure on (like the core, without tidying later changes).
      set_clef({ clef }) {
        snapshot();
        const st = view.score.staves[view.caret.staff];
        const m = view.caret.measure;
        if (m === 0) { st.clef = clef; return; }
        let before = st.clef;
        for (let k = m - 1; k >= 1; k--) if (st.measures[k].clef) { before = st.measures[k].clef; break; }
        st.measures[m].clef = before === clef ? null : clef;
      },
      // Lines from the first note of the caret's measure to the note before
      // the caret (the fake has no selections); a glissando to the next note.
      set_line({ kind }) {
        const v = voiceOf(view.caret);
        const e = v[view.caret.index - 1];
        if (!e) return;
        snapshot();
        const lines = (view.score.lines = view.score.lines || []);
        const start = kind === 'glissando' ? e : v[0];
        const end = kind === 'glissando' ? v[view.caret.index] : e;
        if (!end) return;
        const i = lines.findIndex((l) => l.start === start.id && l.kind === kind);
        const same = i >= 0 && lines[i].end === end.id;
        if (i >= 0) lines.splice(i, 1);
        if (!same) lines.push({ id: nextId++, start: start.id, end: end.id, kind });
      },
      // The note before the caret, the same sound written another way.
      respell() {
        const e = voiceOf(view.caret)[view.caret.index - 1];
        const ps = e?.kind.chord?.pitches;
        if (!ps) return;
        snapshot();
        const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        e.kind.chord.pitches = ps.map((p) => {
          const midi = (p.octave + 1) * 12 + SEMI[p.step] + p.alter;
          const options = [];
          for (const step of STEPS) for (let alter = -2; alter <= 2; alter++) {
            if (((midi - SEMI[step] - alter) % 12 + 12) % 12 === 0) options.push({ step, alter, octave: (midi - SEMI[step] - alter) / 12 - 1 });
          }
          const rank = (a) => (Math.abs(a) === 1 ? 0 : a === 0 ? 2 : 1);
          options.sort((a, b) => rank(a.alter) - rank(b.alter) || b.alter - a.alter);
          const i = options.findIndex((o) => o.step === p.step && o.alter === p.alter && o.octave === p.octave);
          return options[(i + 1) % options.length];
        });
      },
      // Tremolos on the note before the caret (between: with the one before it).
      set_tremolo({ strokes, between }) {
        const v = voiceOf(view.caret);
        const i = view.caret.index - 1;
        const targets = (between ? [v[i - 1], v[i]] : [v[i]]).filter((e) => e && e.kind !== 'rest');
        if (!targets.length || (between && targets.length < 2)) return;
        snapshot();
        const BASES = ['Breve', 'Whole', 'Half', 'Quarter', 'Eighth', 'Sixteenth', 'ThirtySecond', 'SixtyFourth', 'HundredTwentyEighth'];
        const off = targets.every((e) => e.duration.tremolo?.strokes === strokes && !!e.duration.tremolo?.between === between);
        for (const e of targets) {
          e.duration = { ...e.duration }; // (inserted notes share the toolbar's object)
          const was = !!e.duration.tremolo?.between;
          const k = BASES.indexOf(e.duration.base);
          if (!was && between && !off && k > 0) e.duration.base = BASES[k - 1];
          if (was && (off || !between)) e.duration.base = BASES[k + 1];
          e.duration.tremolo = off ? null : { strokes, between };
        }
      },
      set_beam({ beam }) {
        const e = voiceOf(view.caret)[view.caret.index - 1];
        if (!e || e.kind === 'rest') return;
        snapshot();
        e.beam = beam && e.beam !== beam ? beam : null;
      },
      toggle_tie() { const e = voiceOf(view.caret)[view.caret.index - 1]; if (e && e.kind !== 'rest') { snapshot(); e.tie = !e.tie; } },
      toggle_articulation({ articulation: a }) {
        const e = voiceOf(view.caret)[view.caret.index - 1];
        if (!e) return;
        snapshot();
        const arts = e.articulations || [];
        e.articulations = arts.includes(a) ? arts.filter((x) => x !== a) : [...arts, a];
      },
      set_lyric({ id, verse, text, join }) {
        for (const st of view.score.staves) for (const m of st.measures) for (const v of m.voices) {
          const e = v.find((x) => x.id === id);
          if (!e || e.kind === 'rest') continue;
          snapshot();
          const lyrics = [...(e.lyrics || [])];
          while (lyrics.length <= verse) lyrics.push({ text: '', join: 'none' });
          lyrics[verse] = { text, join: text ? join : 'none' };
          while (lyrics.length && !lyrics.at(-1).text) lyrics.pop();
          e.lyrics = lyrics;
          const mi = st.measures.indexOf(m);
          view.caret = { staff: view.score.staves.indexOf(st), measure: mi, voice: m.voices.indexOf(v), index: v.indexOf(e) + 1 };
        }
      },
      set_dynamic({ dynamic }) { const e = voiceOf(view.caret)[view.caret.index - 1]; if (e) { snapshot(); e.dynamic = e.dynamic === dynamic ? null : dynamic; } },
      // As Document::set_text_style(s), set_text_box and remove_text_box.
      set_text_style({ kind, style }) {
        snapshot();
        view.score.text_styles = { ...(view.score.text_styles || {}), [kind]: style };
      },
      set_text_styles({ styles }) {
        snapshot();
        view.score.text_styles = { ...(view.score.text_styles || {}), ...styles };
      },
      set_text_box({ text_box }) {
        snapshot();
        const boxes = (view.score.text_boxes ||= []);
        if (!text_box.text.trim()) { view.score.text_boxes = boxes.filter((b) => b.id !== text_box.id); return; }
        if (!text_box.id) text_box = { ...text_box, id: nextId++ };
        const i = boxes.findIndex((b) => b.id === text_box.id);
        if (i >= 0) boxes[i] = text_box; else boxes.push(text_box);
      },
      remove_text_box({ id }) {
        snapshot();
        view.score.text_boxes = (view.score.text_boxes || []).filter((b) => b.id !== id);
      },
      // As Document::set_note_text: one text per kind ('' removes it).
      set_note_text({ id, kind, text }) {
        for (const st of view.score.staves) for (const cell of st.measures) for (const v of cell.voices) for (const e of v) {
          if (e.id !== id) continue;
          snapshot();
          e.texts = (e.texts || []).filter((nt) => nt.kind !== kind);
          if (text.trim()) e.texts.push({ kind, text: text.trim() });
          e.texts.sort((a, b) => a.kind.localeCompare(b.kind));
        }
      },
      // As Document::set_barline: one undo step for the measures first..last.
      // As Document::set_repeat: the start on `first`, the end on `last`.
      set_repeat({ first, last, start, end }) {
        snapshot();
        view.score.measures[first] = { ...view.score.measures[first], repeat_start: start };
        view.score.measures[last] = { ...view.score.measures[last], repeat_end: end ?? null };
      },
      // As Document::set_ending: `close` adds an end repeat to the last one.
      set_ending({ first, last, numbers, close }) {
        snapshot();
        for (let m = Math.min(first, last); m <= Math.max(first, last); m++) {
          const a = { ...view.score.measures[m], ending: numbers };
          if (close && m === Math.max(first, last) && numbers.length && !a.repeat_end) a.repeat_end = 2;
          view.score.measures[m] = a;
        }
      },
      set_break({ measure, layout_break }) {
        snapshot();
        view.score.measures[measure] = { ...view.score.measures[measure], break_after: layout_break ?? null };
      },
      set_measure_length({ measure, length }) {
        snapshot();
        view.score.measures[measure] = { ...view.score.measures[measure], length: length ?? null };
      },
      set_jumps({ measure, segno, coda, jump }) {
        snapshot();
        view.score.measures[measure] = { ...view.score.measures[measure], segno, coda, jump: jump ?? null };
      },
      set_barline({ first, last, barline }) {
        snapshot();
        for (let m = Math.min(first, last); m <= Math.max(first, last); m++) {
          view.score.measures[m] = { ...view.score.measures[m], barline };
        }
      },
      set_rehearsal({ measure, text }) {
        snapshot();
        view.score.measures[measure] = { ...view.score.measures[measure], rehearsal: text?.trim() || null };
      },
      // As Document::set_tempo_mark: in measure 1 the value is the opening tempo.
      set_tempo_mark({ measure, mark }) {
        snapshot();
        if (mark && measure === 0 && mark.bpm) { view.score.tempo = mark.bpm; mark = { ...mark, bpm: null }; }
        view.score.measures[measure] = { ...view.score.measures[measure], tempo: mark };
      },
      // Every text at once, as the real backend takes it (Metadata in model.rs).
      set_metadata({ type, ...metadata }) { snapshot(); view.score.metadata = metadata; },
      toggle_slur() {
        // Errors look like the real ones (src-tauri/src/ui_error.rs).
        if (!view.selection) throw { code: 'edit.slur_needs_selection', message: 'Select the notes to slur first (Shift+arrows or drag)' };
        const v = voiceOf(view.caret);
        const i = view.caret.index;
        if (i < 2) return;
        snapshot();
        (view.score.slurs ||= []).push({ id: nextId++, start: v[i - 2].id, end: v[i - 1].id });
      },
      set_accidental({ alter: a }) {
        const e = voiceOf(view.caret)[view.caret.index - 1];
        if (!e || e.kind === 'rest') return;
        snapshot();
        e.kind.chord.pitches.forEach((p) => { p.alter = a; });
      },
      // (The fake backend does not re-spell notes when the transposition
      // changes; it only shows the new key and names.)
      // As Document::set_instrument: braced staves change together, and a
      // lone staff with staves = 2 gets a bass staff below, braced.
      set_staff({ staff, name, short_name, instrument, clef, transposition, staves = 1 }) {
        snapshot();
        const st = view.score.staves[staff];
        const brace = st.group?.kind === 'brace' ? st.group.id : null;
        for (const other of view.score.staves) {
          if (other === st || (brace !== null && other.group?.id === brace)) {
            Object.assign(other, { name, short_name, instrument, transposition }, other === st ? { clef } : {});
          }
        }
        if (brace === null && staves > 1) {
          st.group = { id: nextId++, kind: 'brace' };
          view.score.staves.splice(staff + 1, 0, {
            id: nextId++, name, short_name, clef: 'bass', instrument, transposition, group: st.group,
            measures: view.score.measures.map(() => blank()),
          });
        }
      },
      add_staff({ clef, name, short_name, instrument, transposition, staves = 1 }) {
        snapshot();
        const len = view.score.measures.length;
        const group = staves > 1 ? { id: nextId++, kind: 'brace' } : null;
        for (let k = 0; k < staves; k++) {
          view.score.staves.push({
            id: nextId++, name: name || `Staff ${view.score.staves.length + 1}`, short_name: short_name || '',
            clef: k === 0 ? clef : 'bass',
            instrument: instrument || 0, transposition: transposition || { diatonic: 0, chromatic: 0 }, group,
            measures: Array.from({ length: len }, () => ({ voices: [[], [], [], []] })),
          });
        }
      },
      group_staves({ first, last, kind }) {
        snapshot();
        const group = kind ? { id: nextId++, kind } : null;
        for (let s = first; s <= last; s++) view.score.staves[s].group = group;
      },
      undo() {
        const s = undo.pop();
        if (s) [view.score, view.caret] = JSON.parse(s);
      },
    };
    // Fake sound engine: "downloads" in ~6 s, then plays silently on a
    // clock so the playhead and transport can be tried.
    view.score.tempo ??= 100;
    const sound = { state: 'missing', t0: 0, playing: false, fromTick: 0, startedAt: 0 };
    const MEASURE = 3840;
    const audio = {
      audio_status() {
        if (sound.state === 'downloading') {
          const k = Math.min(1, (Date.now() - sound.t0) / 6000);
          if (k >= 1) sound.state = 'ready';
          else return { state: 'downloading', received: Math.round(148398306 * k), total: 148398306 };
        }
        return { state: sound.state };
      },
      download_soundfont() { sound.state = 'downloading'; sound.t0 = Date.now(); },
      play({ fromStart }) {
        sound.playing = true;
        sound.startedAt = Date.now();
        sound.fromTick = fromStart ? 0 : view.caret.measure * MEASURE;
      },
      playback_state() {
        if (!sound.playing) return { playing: false, measure: 0, tick: 0 };
        const ticks = sound.fromTick + ((Date.now() - sound.startedAt) / 1000) * (view.score.tempo / 60) * 960;
        if (ticks >= view.score.measures.length * MEASURE) { sound.playing = false; return { playing: false, measure: 0, tick: 0 }; }
        return { playing: true, measure: Math.floor(ticks / MEASURE), tick: Math.floor(ticks % MEASURE) };
      },
      pause() { const s = audio.playback_state(); sound.playing = false; view.caret = { ...view.caret, measure: s.measure, index: 0 }; },
      stop_playback() { sound.playing = false; },
      about_info() {
        return {
          name: 'Partita', version: '0.2.0', license: 'GPL-3.0-or-later',
          repository: 'https://github.com/partita-notation/partita', issues: 'https://github.com/partita-notation/partita/issues',
          os: 'windows', arch: 'x86_64', tauri: '2.x (fake)', file_format: 3,
          data_dir: 'C:\\Users\\you\\AppData\\Local\\io.github.partita-notation.partita',
          soundfont: {
            name: 'FluidR3 GM', version: '3.1', author: 'Frank Wen', license: 'MIT',
            homepage: 'https://github.com/pianobooster/fluid-soundfont', source_url: '',
