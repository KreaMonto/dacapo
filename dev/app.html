<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>App Preview</title>
  <link rel="stylesheet" href="../src/styles.css">
</head>
<body>
  <!-- Development only: runs the real frontend (src/index.html + app.js)
       against an in-memory fake backend, so the UI can be tried in a normal
       browser. The fake supports only a few actions and none of the real
       rules; the Rust core is the reference. -->
  <script type="module">
    const html = await (await fetch('../src/index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script').forEach((s) => s.remove());
    document.body.innerHTML = doc.body.innerHTML;

    const STEPS = 'CDEFGAB';
    const SHARPS = 'FCGDAEB';
    let nextId = 1;
    const blank = () => ({ voices: [[], [], [], []] });
    const view = {
      id: 'dev', name: 'Dev preview', path: null, dirty: false, can_undo: false, can_redo: false,
      protected: true, warning: null, selection: null, issues: [],
      caret: { staff: 0, measure: 0, voice: 0, index: 0 },
      score: {
        metadata: { title: 'Dev preview', composer: '' },
        measures: Array.from({ length: 8 }, () => ({ time: { beats: 4, beat_type: 4 }, key: { fifths: 1 } })),
        staves: [
          { id: 1, name: 'RH', clef: 'treble', measures: Array.from({ length: 8 }, blank) },
          { id: 2, name: 'LH', clef: 'bass', measures: Array.from({ length: 8 }, blank) },
        ],
      },
    };
    // Measures 3–6 start as whole-measure rests, to show multi-measure rests.
    for (const st of view.score.staves) {
      for (let m = 2; m <= 5; m++) st.measures[m].voices[0] = [{ id: nextId++, duration: { base: 'Whole', dots: 0 }, kind: 'rest' }];
    }
    const undo = [];
    // Like Document::insert_event: writing into a measure rest replaces it.
    const replaceMeasureRest = (at) => {
      const v = voiceOf(at);
      if (v.length === 1 && v[0].kind === 'rest' && v[0].duration.base === 'Whole') { v.length = 0; at.index = 0; }
    };
    const alter = (m, step) => {
      const f = view.score.measures[m].key.fifths;
      if (f > 0 && SHARPS.slice(0, f).includes(step)) return 1;
      if (f < 0 && SHARPS.slice(7 + f).includes(step)) return -1;
      return 0;
    };
    const voiceOf = (c) => view.score.staves[c.staff].measures[c.measure].voices[c.voice];
    const snapshot = () => undo.push(JSON.stringify([view.score, view.caret]));
    const handlers = {
      move_pitch({ id, pitch, steps }) {
        snapshot();
        const shift = (q) => { const d = q.octave * 7 + STEPS.indexOf(q.step) + steps; return { ...q, step: STEPS[((d % 7) + 7) % 7], octave: Math.floor(d / 7) }; };
        for (const st of view.score.staves) for (const m of st.measures) for (const v of m.voices) {
          const i = v.findIndex((e) => e.id === id);
          if (i < 0 || v[i].kind === 'rest') continue;
          const ps = v[i].kind.chord.pitches;
          const only = pitch && ps.length > 1 ? pitch : null;
          v[i].kind.chord.pitches = ps.map((q) => (only && !(q.step === only.step && q.octave === only.octave) ? q : shift(q)));
          view.caret = { ...view.caret, index: i + 1 };
        }
      },
      erase({ targets }) {
        snapshot();
        for (const { id, pitch } of targets) {
          for (const st of view.score.staves) for (const m of st.measures) for (const v of m.voices) {
            const i = v.findIndex((e) => e.id === id);
            if (i < 0) continue;
            const ps = v[i].kind.chord?.pitches;
            const keep = pitch && ps ? ps.filter((q) => !(q.step === pitch.step && q.octave === pitch.octave)) : [];
            if (keep.length && keep.length < ps.length) v[i].kind.chord.pitches = keep;
            else v.splice(i, 1);
          }
        }
      },
      place_note({ at, step, octave, duration }) {
        snapshot();
        replaceMeasureRest(at);
        voiceOf(at).splice(at.index, 0, { id: nextId++, duration, kind: { chord: { pitches: [{ step, octave, alter: alter(at.measure, step) }] } } });
        view.caret = { ...at, index: at.index + 1 };
      },
      // Keyboard entry, roughly like the core: nearest octave to the previous note.
      insert_note({ step, duration }) {
        const prev = voiceOf(view.caret)[view.caret.index - 1]?.kind.chord?.pitches.at(-1) || { step: 'B', octave: 4 };
        const di = (s, o) => o * 7 + STEPS.indexOf(s);
        const octave = [prev.octave - 1, prev.octave, prev.octave + 1]
          .sort((a, b) => Math.abs(di(step, a) - di(prev.step, prev.octave)) - Math.abs(di(step, b) - di(prev.step, prev.octave)))[0];
        handlers.place_note({ at: { ...view.caret }, step, octave, duration });
      },
      add_to_chord({ step }) {
        const index = view.caret.index - 1;
        const e = voiceOf(view.caret)[index];
        if (!e || e.kind === 'rest') return;
        const top = e.kind.chord.pitches.at(-1);
        const octave = STEPS.indexOf(step) <= STEPS.indexOf(top.step) ? top.octave + 1 : top.octave;
        handlers.add_pitch({ at: { ...view.caret, index }, step, octave });
      },
      place_rest({ at, duration }) {
        snapshot();
        replaceMeasureRest(at);
        voiceOf(at).splice(at.index, 0, { id: nextId++, duration, kind: 'rest' });
        view.caret = { ...at, index: at.index + 1 };
      },
      add_pitch({ at, step, octave }) {
        snapshot();
        const e = voiceOf(at)[at.index];
        const p = { step, octave, alter: alter(at.measure, step) };
        if (e.kind === 'rest') e.kind = { chord: { pitches: [p] } };
        else e.kind.chord.pitches.push(p);
        view.caret = { ...at, index: at.index + 1 };
      },
      set_caret({ caret }) { view.caret = caret; },
      set_tempo({ bpm }) { snapshot(); view.score.tempo = bpm; },
      // Marks act on the event before the caret (the fake has no selections).
      toggle_tie() { const e = voiceOf(view.caret)[view.caret.index - 1]; if (e && e.kind !== 'rest') { snapshot(); e.tie = !e.tie; } },
      toggle_articulation({ articulation: a }) {
        const e = voiceOf(view.caret)[view.caret.index - 1];
        if (!e) return;
        snapshot();
        const arts = e.articulations || [];
        e.articulations = arts.includes(a) ? arts.filter((x) => x !== a) : [...arts, a];
      },
      set_lyric({ id, verse, text, join }) {
        for (const st of view.score.staves) for (const m of st.measures) for (const v of m.voices) {
          const e = v.find((x) => x.id === id);
          if (!e || e.kind === 'rest') continue;
          snapshot();
          const lyrics = [...(e.lyrics || [])];
          while (lyrics.length <= verse) lyrics.push({ text: '', join: 'none' });
          lyrics[verse] = { text, join: text ? join : 'none' };
          while (lyrics.length && !lyrics.at(-1).text) lyrics.pop();
          e.lyrics = lyrics;
          const mi = st.measures.indexOf(m);
          view.caret = { staff: view.score.staves.indexOf(st), measure: mi, voice: m.voices.indexOf(v), index: v.indexOf(e) + 1 };
        }
      },
      set_dynamic({ dynamic }) { const e = voiceOf(view.caret)[view.caret.index - 1]; if (e) { snapshot(); e.dynamic = e.dynamic === dynamic ? null : dynamic; } },
      toggle_slur() {
        const v = voiceOf(view.caret);
        const i = view.caret.index;
        if (i < 2) return;
        snapshot();
        (view.score.slurs ||= []).push({ id: nextId++, start: v[i - 2].id, end: v[i - 1].id });
      },
      set_accidental({ alter: a }) {
        const e = voiceOf(view.caret)[view.caret.index - 1];
        if (!e || e.kind === 'rest') return;
        snapshot();
        e.kind.chord.pitches.forEach((p) => { p.alter = a; });
      },
      undo() {
        const s = undo.pop();
        if (s) [view.score, view.caret] = JSON.parse(s);
      },
    };
    // Fake sound engine: "downloads" in ~6 s, then plays silently on a
    // clock so the playhead and transport can be tried.
    view.score.tempo = 100;
    const sound = { state: 'missing', t0: 0, playing: false, fromTick: 0, startedAt: 0 };
    const MEASURE = 3840;
    const audio = {
      audio_status() {
        if (sound.state === 'downloading') {
          const k = Math.min(1, (Date.now() - sound.t0) / 6000);
          if (k >= 1) sound.state = 'ready';
          else return { state: 'downloading', received: Math.round(148398306 * k), total: 148398306 };
        }
        return { state: sound.state };
      },
      download_soundfont() { sound.state = 'downloading'; sound.t0 = Date.now(); },
      play({ fromStart }) {
        sound.playing = true;
        sound.startedAt = Date.now();
        sound.fromTick = fromStart ? 0 : view.caret.measure * MEASURE;
      },
      playback_state() {
        if (!sound.playing) return { playing: false, measure: 0, tick: 0 };
        const ticks = sound.fromTick + ((Date.now() - sound.startedAt) / 1000) * (view.score.tempo / 60) * 960;
        if (ticks >= view.score.measures.length * MEASURE) { sound.playing = false; return { playing: false, measure: 0, tick: 0 }; }
        return { playing: true, measure: Math.floor(ticks / MEASURE), tick: Math.floor(ticks % MEASURE) };
      },
      pause() { const s = audio.playback_state(); sound.playing = false; view.caret = { ...view.caret, measure: s.measure, index: 0 }; },
      stop_playback() { sound.playing = false; },
      about_info() {
        return {
          name: 'Da Capo', version: '0.2.0', license: 'GPL-3.0-or-later',
          repository: 'https://github.com/dacapo-editor/dacapo', issues: 'https://github.com/dacapo-editor/dacapo/issues',
          os: 'windows', arch: 'x86_64', tauri: '2.x (fake)', file_format: 3,
          data_dir: 'C:\\Users\\you\\AppData\\Local\\io.github.dacapo-editor.dacapo',
          soundfont: {
            name: 'FluidR3 GM', version: '3.1', author: 'Frank Wen', license: 'MIT',
            homepage: 'https://github.com/pianobooster/fluid-soundfont', source_url: '',
            installed: sound.state === 'ready', path: 'C:\\Users\\you\\AppData\\Local\\io.github.dacapo-editor.dacapo\\soundfonts\\FluidR3_GM.sf2',
            size_bytes: sound.state === 'ready' ? 148398306 : 0, status: audio.audio_status(),
          },
          credits: [
            { name: 'Bravura', version: 'bundled', author: 'Steinberg Media Technologies', license: 'SIL Open Font License 1.1', url: 'https://github.com/steinbergmedia/bravura', role: 'Music font (SMuFL) used to engrave the score' },
            { name: 'FluidR3 GM', version: '3.1', author: 'Frank Wen', license: 'MIT', url: 'https://github.com/pianobooster/fluid-soundfont', role: 'Instrument sounds for playback (downloaded on first use)' },
            { name: 'RustySynth', version: '1.3', author: 'Nobuaki Tanaka', license: 'MIT', url: 'https://github.com/sinshu/rustysynth', role: 'SoundFont synthesizer' },
          ],
        };
      },
    };
    // Fake updater. `?update=0.3.0` offers that version (download takes ~3 s);
    // `?update=none` is up to date; without the parameter the check fails,
    // as it does before the first release exists.
    const offered = new URLSearchParams(location.search).get('update');
    let upd = { state: 'idle' };
    const updater = {
      check_for_update() {
        if (!offered) upd = { state: 'error', message: 'fake: no release yet (404)' };
        else if (offered === 'none') upd = { state: 'up_to_date', current: '0.2.0' };
        else upd = { state: 'available', version: offered, current: '0.2.0', notes: '', date: '2026-12-01' };
        return upd;
      },
      update_status: () => upd,
      download_update() {
        const total = 12e6;
        let received = 0;
        upd = { state: 'downloading', version: offered, received, total };
        const t = setInterval(() => {
          received = Math.min(total, received + 1e6);
          upd = received < total ? { ...upd, received } : { state: 'ready', version: offered };
          if (received >= total) clearInterval(t);
        }, 250);
      },
      install_update() { location.reload(); },
    };
    try { localStorage.removeItem('dacapo.updates.lastCheck'); } catch {}
    window.__TAURI__ = {
      core: {
        async invoke(cmd, args) {
          if (cmd in updater) return updater[cmd](args || {});
          if (cmd in audio) {
            const r = audio[cmd](args || {});
            if (cmd === 'pause') return structuredClone(view);
            return r;
          }
          if (cmd === 'edit') {
            handlers[args.action.type]?.(args.action);
            view.dirty = undo.length > 0;
            view.can_undo = undo.length > 0;
            // Same rule as Score::validate: a voice longer than its measure.
            const ticks = (d) => { const b = 7680 >> ['Breve', 'Whole', 'Half', 'Quarter', 'Eighth', 'Sixteenth', 'ThirtySecond', 'SixtyFourth', 'HundredTwentyEighth'].indexOf(d.base); let t = 0; for (let i = 0; i <= d.dots; i++) t += b >> i; return t; };
            view.issues = [];
            view.score.staves.forEach((st, s) => st.measures.forEach((m, mi) => m.voices.forEach((v, vi) => {
              const t = v.reduce((a, e) => a + ticks(e.duration), 0);
              const attrs = view.score.measures[mi];
              const cap = attrs.time.beats * (3840 / attrs.time.beat_type);
              const mrest = v.length === 1 && v[0].kind === 'rest' && v[0].duration.base === 'Whole';
              if (t > cap && !mrest) view.issues.push({ type: 'overfull', staff: s, measure: mi, voice: vi, ticks: t, capacity: cap });
            })));
          }
          if (cmd === 'list_recoverable' || cmd === 'list_documents') return [];
          return structuredClone(view);
        },
      },
      dialog: {},
      event: { listen: async () => {} },
    };
    window.__STEPS = STEPS;
    await import('../src/app.js');
  </script>
</body>
</html>
