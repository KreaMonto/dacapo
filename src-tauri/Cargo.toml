[package]
name = "dacapo"
description = "Da Capo — open source music notation editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dacapo-core = { path = "../crates/dacapo-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
# Playback: SoundFont synthesizer (MIT), audio output (Apache-2.0), and the
# HTTP client used to download the FluidR3 SoundFont (MIT/Apache-2.0).
rustysynth = "1.3"
cpal = "0.15"
ureq = "2"
