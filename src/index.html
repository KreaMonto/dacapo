<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partita</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon sprite: 24×24 stroke icons, used with <svg class="icon"><use href="#i-…"/></svg>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-new" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v5h7V3"/><path d="M7 21v-7h10v7"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></symbol>
      <symbol id="i-measure-add" viewBox="0 0 24 24"><path d="M3 7h11M3 12h11M3 17h11"/><path d="M3 5v14M14 5v14"/><path d="M19 9v6M16 12h6"/></symbol>
      <symbol id="i-measure-remove" viewBox="0 0 24 24"><path d="M3 7h11M3 12h11M3 17h11"/><path d="M3 5v14M14 5v14"/><path d="M16 12h6"/></symbol>
      <symbol id="i-staff-add" viewBox="0 0 24 24"><path d="M2 5h12M2 8.5h12M2 12h12"/><path d="M2 16h12M2 19.5h12" opacity=".45"/><path d="M19 13v6M16 16h6"/></symbol>
      <symbol id="i-staff-remove" viewBox="0 0 24 24"><path d="M2 5h12M2 8.5h12M2 12h12"/><path d="M2 16h12M2 19.5h12" opacity=".45"/><path d="M16 16h6"/></symbol>
      <symbol id="i-multirest" viewBox="0 0 24 24"><path d="M4 8v8M20 8v8"/><path d="M4 12h16" stroke-width="4"/><path d="M10 3.5h4" opacity=".7"/></symbol>
      <symbol id="i-select" viewBox="0 0 24 24"><path d="M5 3l14 8-6.5 1.8L10 19z"/></symbol>
      <symbol id="i-erase" viewBox="0 0 24 24"><path d="M15.5 3.5l5 5-10 10H6l-3-3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 10l5 5" stroke="currentColor" stroke-width="2"/><path d="M11 20.5h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/></symbol>
      <symbol id="i-text" viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></symbol>
      <symbol id="i-align-left" viewBox="0 0 24 24"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></symbol>
      <symbol id="i-align-center" viewBox="0 0 24 24"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></symbol>
      <symbol id="i-align-right" viewBox="0 0 24 24"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></symbol>
      <symbol id="i-frame" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/><path d="M8 10h8M8 14h5"/></symbol>
      <symbol id="i-bracket" viewBox="0 0 24 24"><path d="M10 4H6v16h4"/><path d="M13 8h8M13 16h8"/></symbol>
      <symbol id="i-brace" viewBox="0 0 24 24"><path d="M10 4C8 4 8 5 8 7v2.5C8 11 7 12 5.5 12 7 12 8 13 8 14.5V17c0 2 0 3 2 3"/><path d="M13 8h8M13 16h8"/></symbol>
      <symbol id="i-none" viewBox="0 0 24 24"><path d="M10 4H6v5M6 15v5h4"/><path d="M13 8h8M13 16h8"/><path d="M4 12h4" stroke-dasharray="1 2"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M6 7l5 5-5 5M13 7l5 5-5 5"/></symbol>
      <symbol id="i-start" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M9 12l10-7v14z" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <nav id="menubar" class="menubar" data-i18n-aria="menu.label"></nav>

  <!-- Thin bars, each a named group of tools (its name shows in the
       tooltips). What does not fit the window goes behind ». -->
  <!-- Thin bars, each a named group of tools (its name shows in the
       tooltips), in two rows. toolbars.js holds which bar goes where
       (DEFAULT_LAYOUT); what does not fit a row goes behind ». -->
  <header class="toolbars">
    <div class="toolbar" role="toolbar" data-zone="top1" data-i18n-aria="toolbar.label">
      <div class="tbar-row">
        <div class="tbar" role="group" data-bar-id="file" data-i18n-bar="bar.file" data-i18n-aria="bar.file">
          <button data-cmd="new" class="ibtn" data-i18n-aria="toolbar.new" data-i18n-tip="toolbar.new" data-i18n-desc="toolbar.new.desc" data-key="Ctrl+N"><svg class="icon"><use href="#i-new"/></svg></button>
          <button data-cmd="open" class="ibtn" data-i18n-aria="toolbar.open" data-i18n-tip="toolbar.open.tip" data-i18n-desc="toolbar.open.desc" data-key="Ctrl+O"><svg class="icon"><use href="#i-open"/></svg></button>
          <button data-cmd="save" class="ibtn" data-i18n-aria="toolbar.save" data-i18n-tip="toolbar.save" data-i18n-desc="toolbar.save.desc" data-key="Ctrl+S"><svg class="icon"><use href="#i-save"/></svg></button>
        </div>
        <div class="tbar" role="group" data-bar-id="edit" data-i18n-bar="bar.edit" data-i18n-aria="bar.edit">
          <button data-cmd="undo" class="ibtn" data-i18n-aria="toolbar.undo" data-i18n-tip="toolbar.undo" data-i18n-desc="toolbar.undo.desc" data-key="Ctrl+Z"><svg class="icon"><use href="#i-undo"/></svg></button>
          <button data-cmd="redo" class="ibtn" data-i18n-aria="toolbar.redo" data-i18n-tip="toolbar.redo" data-key="Ctrl+Y"><svg class="icon"><use href="#i-redo"/></svg></button>
        </div>
        <div class="tbar transport" role="group" data-bar-id="playback" data-i18n-bar="bar.playback" data-i18n-aria="bar.playback">
          <button data-cmd="play-start" class="ibtn" data-i18n-aria="toolbar.playstart" data-i18n-tip="toolbar.playstart" data-key="Shift+Space"><svg class="icon"><use href="#i-start"/></svg></button>
          <button data-cmd="play" id="play-btn" class="ibtn play" data-i18n-aria="toolbar.play" data-i18n-tip="toolbar.play.tip" data-i18n-desc="toolbar.play.desc" data-key="Space"><svg class="icon"><use href="#i-play"/></svg></button>
          <button data-cmd="stop" class="ibtn" data-i18n-aria="toolbar.stop" data-i18n-tip="toolbar.stop" data-i18n-desc="toolbar.stop.desc" data-key="Esc"><svg class="icon"><use href="#i-stop"/></svg></button>
          <label class="tempo" data-i18n-tip="toolbar.tempo" data-i18n-desc="toolbar.tempo.desc">
            <span class="m tempo-note">&#xE1D5;</span> =
            <input id="tempo" size="3" inputmode="numeric" data-i18n-aria="toolbar.tempo.aria">
          </label>
        </div>
        <div class="tbar" role="group" data-bar-id="view" data-i18n-bar="bar.view" data-i18n-aria="bar.view">
          <button data-cmd="multirest" class="ibtn" aria-pressed="true" data-i18n-aria="toolbar.multirest" data-i18n-tip="toolbar.multirest" data-i18n-desc="toolbar.multirest.desc"><svg class="icon"><use href="#i-multirest"/></svg></button>
        </div>
      </div>
      <button class="ibtn tbar-more" hidden aria-haspopup="true" aria-expanded="false" data-i18n-tip="bar.more" data-i18n-desc="bar.more.desc" data-i18n-aria="bar.more"><svg class="icon"><use href="#i-more"/></svg></button>
      <div class="tbar-overflow" hidden></div>
    </div>
    <div class="toolbar" role="toolbar" data-zone="top2" data-i18n-aria="toolbar.label.score">
      <div class="tbar-row">
        <div class="tbar" role="group" data-bar-id="tools" data-i18n-bar="bar.tools" data-i18n-aria="bar.tools">
          <button data-cmd="select" class="ibtn tool" data-i18n-tip="palette.select" data-i18n-desc="palette.select.desc" data-key="Esc" data-i18n-aria="palette.select"><svg class="icon"><use href="#i-select"/></svg></button>
          <button data-cmd="erase" class="ibtn tool" data-i18n-tip="palette.erase" data-i18n-desc="palette.erase.desc" data-key="X" data-i18n-aria="palette.erase"><svg class="icon"><use href="#i-erase"/></svg></button>
          <button data-cmd="text" class="ibtn tool" data-i18n-tip="palette.text" data-i18n-desc="palette.text.desc" data-i18n-aria="palette.text"><svg class="icon"><use href="#i-text"/></svg></button>
        </div>
        <div class="tbar" role="group" data-bar-id="measure" data-i18n-bar="bar.measure" data-i18n-aria="bar.measure">
          <label data-i18n-tip="toolbar.clef" data-i18n-desc="toolbar.clef.desc"><span data-i18n="toolbar.clef"></span>
            <select id="clef">
              <option value="treble" data-i18n="clef.treble"></option>
              <option value="bass" data-i18n="clef.bass"></option>
              <option value="alto" data-i18n="clef.alto"></option>
              <option value="tenor" data-i18n="clef.tenor"></option>
            </select>
          </label>
          <label data-i18n-tip="toolbar.key.tip" data-i18n-desc="toolbar.key.desc"><span data-i18n="toolbar.key"></span>
            <select id="key"></select>
          </label>
          <label data-i18n-tip="toolbar.time.tip" data-i18n-desc="toolbar.time.desc"><span data-i18n="toolbar.time"></span>
            <input id="time" size="4">
          </label>
          <button data-cmd="add-measure" class="ibtn" data-i18n-aria="toolbar.addmeasure" data-i18n-tip="toolbar.addmeasure" data-i18n-desc="toolbar.addmeasure.desc" data-key="Ctrl+Enter"><svg class="icon"><use href="#i-measure-add"/></svg></button>
          <button data-cmd="remove-measure" class="ibtn" data-i18n-aria="toolbar.removemeasure" data-i18n-tip="toolbar.removemeasure" data-i18n-desc="toolbar.removemeasure.desc"><svg class="icon"><use href="#i-measure-remove"/></svg></button>
        </div>
        <div class="tbar" role="group" data-bar-id="staves" data-i18n-bar="bar.staves" data-i18n-aria="bar.staves">
          <button data-cmd="add-staff" class="ibtn" data-i18n-aria="toolbar.addstaff" data-i18n-tip="toolbar.addstaff" data-i18n-desc="toolbar.addstaff.desc"><svg class="icon"><use href="#i-staff-add"/></svg></button>
          <button data-cmd="remove-staff" class="ibtn" data-i18n-aria="toolbar.removestaff" data-i18n-tip="toolbar.removestaff" data-i18n-desc="toolbar.removestaff.desc"><svg class="icon"><use href="#i-staff-remove"/></svg></button>
          <button data-cmd="group-bracket" class="ibtn" data-i18n-aria="menu.score.group.bracket" data-i18n-tip="menu.score.group.bracket" data-i18n-desc="menu.score.group.bracket.desc"><svg class="icon"><use href="#i-bracket"/></svg></button>
          <button data-cmd="group-brace" class="ibtn" data-i18n-aria="menu.score.group.brace" data-i18n-tip="menu.score.group.brace" data-i18n-desc="menu.score.group.brace.desc"><svg class="icon"><use href="#i-brace"/></svg></button>
          <button data-cmd="group-none" class="ibtn" data-i18n-aria="menu.score.group.none" data-i18n-tip="menu.score.group.none" data-i18n-desc="menu.score.group.none.desc"><svg class="icon"><use href="#i-none"/></svg></button>
        </div>
        <div class="tbar" role="group" data-bar-id="indications" data-i18n-bar="bar.indications" data-i18n-aria="bar.indications">
          <button data-cmd="tempo-mark" class="text-btn" data-i18n-tip="palette.tempo" data-i18n-desc="palette.tempo.desc" data-i18n-aria="palette.tempo"><span class="m">&#xECA5;</span>&#8202;=</button>
          <button data-cmd="rehearsal" class="text-btn" data-i18n-tip="palette.rehearsal" data-i18n-desc="palette.rehearsal.desc" data-i18n-aria="palette.rehearsal"><span class="boxed">A</span></button>
        </div>
      </div>
      <button class="ibtn tbar-more" hidden aria-haspopup="true" aria-expanded="false" data-i18n-tip="bar.more" data-i18n-desc="bar.more.desc" data-i18n-aria="bar.more"><svg class="icon"><use href="#i-more"/></svg></button>
      <div class="tbar-overflow" hidden></div>
    </div>
  </header>

  <div class="workspace">
    <!-- Left of the score: note entry, one column of bars (see toolbars.js). -->
    <aside class="toolbar vzone" id="entry" role="toolbar" data-zone="left" data-i18n-aria="toolbar.label.entry">
      <div class="tbar-row">
        <div class="tbar" role="group" data-bar-id="figures" data-i18n-bar="bar.figures" data-i18n-aria="bar.figures">
          <!-- Two columns, notes and rests, each figure beside its rest; app.js
               fills them (FIGURES). -->
          <div class="figures" data-i18n-aria="palette.value"></div>
          <button data-cmd="dot" class="glyph" data-i18n-tip="palette.dot" data-i18n-desc="palette.dot.desc" data-i18n-aria="palette.dot" data-key=".">&#xE1E7;</button>
        </div>
        <div class="tbar" role="group" data-bar-id="accidentals" data-i18n-bar="bar.accidentals" data-i18n-aria="bar.accidentals">
          <button data-alter="1" class="glyph" data-i18n-aria="palette.sharp" data-i18n-tip="palette.sharp" data-i18n-desc="palette.sharp.desc" data-key="+">&#xE262;</button>
          <button data-alter="-1" class="glyph" data-i18n-aria="palette.flat" data-i18n-tip="palette.flat" data-i18n-desc="palette.flat.desc" data-key="-">&#xE260;</button>
          <button data-alter="0" class="glyph" data-i18n-aria="palette.natural" data-i18n-tip="palette.natural" data-i18n-desc="palette.natural.desc">&#xE261;</button>
        </div>
        <div class="tbar" role="group" data-bar-id="voice" data-i18n-bar="bar.voice" data-i18n-aria="bar.voice">
          <div class="voices" id="voices"></div>
        </div>
      </div>
      <button class="ibtn tbar-more" hidden aria-haspopup="true" aria-expanded="false" data-i18n-tip="bar.more" data-i18n-desc="bar.more.desc" data-i18n-aria="bar.more"><svg class="icon"><use href="#i-more"/></svg></button>
      <div class="tbar-overflow" hidden></div>
    </aside>

    <!-- The document area: tabs and the recovery banner sit above the page,
         between the entry bars and the marks. -->
    <div class="document">
    <nav class="tabs" id="tabs" role="tablist" data-i18n-aria="tabs.label"></nav>

    <div id="recovery" class="recovery" hidden></div>

    <main id="page" class="page" tabindex="0" data-i18n-aria="score.label">
      <div class="sheet">
        <div id="score" class="score"></div>
      </div>
    </main>
    </div>

    <!-- Right of the score: the marks that go on notes. Glyphs are SMuFL
         code points in Bravura. Marks apply to the note before the caret,
         or to every note in the selection. -->
    <aside class="toolbar vzone" id="marks" role="toolbar" data-zone="right" data-i18n-aria="toolbar.label.marks">
      <div class="tbar-row">
        <div class="tbar" role="group" data-bar-id="lines" data-i18n-bar="palette.lines" data-i18n-aria="palette.lines">
          <button data-cmd="tie" class="icon-btn" data-i18n-aria="palette.tie" data-i18n-tip="palette.tie" data-i18n-desc="palette.tie.desc" data-key="T">
            <svg viewBox="0 0 40 24" aria-hidden="true"><ellipse cx="9" cy="9" rx="5" ry="3.6" transform="rotate(-20 9 9)"/><ellipse cx="31" cy="9" rx="5" ry="3.6" transform="rotate(-20 31 9)"/><path d="M10 14 Q20 22 30 14 Q20 19 10 14Z"/></svg>
          </button>
          <button data-cmd="slur" class="icon-btn" data-i18n-aria="palette.slur" data-i18n-tip="palette.slur" data-i18n-desc="palette.slur.desc" data-key="S">
            <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M5 18 Q20 0 35 18 Q20 5 5 18Z"/></svg>
          </button>
        </div>
        <div class="tbar" role="group" data-bar-id="articulations" data-i18n-bar="palette.articulations" data-i18n-aria="palette.articulations">
          <button data-artic="staccato" class="glyph" data-i18n-aria="palette.staccato" data-i18n-tip="palette.staccato" data-i18n-desc="palette.staccato.desc">&#xE4A2;</button>
          <button data-artic="staccatissimo" class="glyph" data-i18n-aria="palette.staccatissimo" data-i18n-tip="palette.staccatissimo" data-i18n-desc="palette.staccatissimo.desc">&#xE4A6;</button>
          <button data-artic="tenuto" class="glyph" data-i18n-aria="palette.tenuto" data-i18n-tip="palette.tenuto" data-i18n-desc="palette.tenuto.desc">&#xE4A4;</button>
          <button data-artic="accent" class="glyph" data-i18n-aria="palette.accent" data-i18n-tip="palette.accent" data-i18n-desc="palette.accent.desc">&#xE4A0;</button>
          <button data-artic="marcato" class="glyph" data-i18n-aria="palette.marcato" data-i18n-tip="palette.marcato" data-i18n-desc="palette.marcato.desc">&#xE4AC;</button>
          <button data-artic="fermata" class="glyph" data-i18n-aria="palette.fermata" data-i18n-tip="palette.fermata" data-i18n-desc="palette.fermata.desc">&#xE4C0;</button>
        </div>
        <div class="tbar" role="group" data-bar-id="dynamics" data-i18n-bar="palette.dynamics" data-i18n-aria="palette.dynamics">
          <!-- A drop-down: the button shows the last dynamic chosen; a click
               opens all of them (toolbars.js, installDrops). -->
          <div class="drop" data-drop="dynamics">
            <button class="glyph drop-btn" aria-haspopup="true" aria-expanded="false" data-i18n-tip="palette.dynamics" data-i18n-desc="palette.dynamics.drop" data-i18n-aria="palette.dynamics">&#xE52D;</button>
            <div class="drop-pop" role="group" data-i18n-aria="palette.dynamics" hidden>
              <button data-dyn="ppp" class="glyph" aria-label="ppp" data-i18n-tip="palette.ppp" data-i18n-desc="palette.ppp.desc">&#xE52A;</button>
              <button data-dyn="pp" class="glyph" aria-label="pp" data-i18n-tip="palette.pp" data-i18n-desc="palette.pp.desc">&#xE52B;</button>
              <button data-dyn="p" class="glyph" aria-label="p" data-i18n-tip="palette.p" data-i18n-desc="palette.p.desc">&#xE520;</button>
              <button data-dyn="mp" class="glyph" aria-label="mp" data-i18n-tip="palette.mp" data-i18n-desc="palette.mp.desc">&#xE52C;</button>
              <button data-dyn="mf" class="glyph" aria-label="mf" data-i18n-tip="palette.mf" data-i18n-desc="palette.mf.desc">&#xE52D;</button>
              <button data-dyn="f" class="glyph" aria-label="f" data-i18n-tip="palette.f" data-i18n-desc="palette.f.desc">&#xE522;</button>
              <button data-dyn="ff" class="glyph" aria-label="ff" data-i18n-tip="palette.ff" data-i18n-desc="palette.ff.desc">&#xE52F;</button>
              <button data-dyn="fff" class="glyph" aria-label="fff" data-i18n-tip="palette.fff" data-i18n-desc="palette.fff.desc">&#xE530;</button>
              <button data-dyn="sfz" class="glyph" aria-label="sfz" data-i18n-tip="palette.sfz" data-i18n-desc="palette.sfz.desc">&#xE539;</button>
              <button data-dyn="fp" class="glyph" aria-label="fp" data-i18n-tip="palette.fp" data-i18n-desc="palette.fp.desc">&#xE534;</button>
            </div>
          </div>
        </div>
        <div class="tbar" role="group" data-bar-id="expressions" data-i18n-bar="palette.markings" data-i18n-aria="palette.markings">
          <button data-cmd="note-text:expression" class="text-btn" data-i18n-tip="palette.expression" data-i18n-desc="palette.expression.desc" data-i18n-aria="palette.expression" data-key="Ctrl+E"><i>dolce</i></button>
          <button data-cmd="note-text:technique" class="text-btn" data-i18n-tip="palette.technique" data-i18n-desc="palette.technique.desc" data-i18n-aria="palette.technique">pizz.</button>
        </div>
      </div>
      <button class="ibtn tbar-more" hidden aria-haspopup="true" aria-expanded="false" data-i18n-tip="bar.more" data-i18n-desc="bar.more.desc" data-i18n-aria="bar.more"><svg class="icon"><use href="#i-more"/></svg></button>
      <div class="tbar-overflow" hidden></div>
    </aside>
  </div>

  <footer class="status" id="status" aria-live="polite"></footer>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <dialog id="dialog" class="dialog"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
