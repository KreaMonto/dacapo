<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Da Capo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar" role="toolbar" aria-label="Main toolbar">
    <div class="group">
      <button data-cmd="new" title="New score (Ctrl+N)">New</button>
      <button data-cmd="open" title="Open (Ctrl+O)">Open</button>
      <button data-cmd="save" title="Save (Ctrl+S)">Save</button>
    </div>
    <div class="group">
      <button data-cmd="undo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button data-cmd="redo" title="Redo (Ctrl+Y)" aria-label="Redo">↷</button>
    </div>
    <div class="group">
      <label>Clef
        <select id="clef" title="Clef of the current staff">
          <option value="treble">Treble</option>
          <option value="bass">Bass</option>
          <option value="alto">Alto</option>
          <option value="tenor">Tenor</option>
        </select>
      </label>
      <label>Key
        <select id="key" title="Key signature from the current measure"></select>
      </label>
      <label>Time
        <input id="time" size="4" title="Time signature from the current measure (e.g. 3/4), Enter to apply">
      </label>
    </div>
    <div class="group">
      <button data-cmd="add-measure" title="Insert measure after the caret (Ctrl+Enter)">+ Measure</button>
      <button data-cmd="remove-measure" title="Delete current measure">− Measure</button>
      <button data-cmd="add-staff" title="Add a staff">+ Staff</button>
      <button data-cmd="remove-staff" title="Delete current staff">− Staff</button>
    </div>
    <div class="group">
      <button data-cmd="multirest" aria-pressed="true" title="Show consecutive empty measures as one multi-measure rest">𝄩 Multirests</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Open documents"></nav>

  <div id="recovery" class="recovery" hidden></div>

  <div class="workspace">
    <aside class="palette" id="palette" aria-label="Palette">
      <button data-cmd="select" class="tool wide" title="Select tool: click to place the caret, drag to select (Esc)">↖ Select</button>

      <h3>Figures</h3>
      <div class="switch" role="radiogroup" aria-label="Notes or rests">
        <button data-kind="note" role="radio" title="Place notes">Notes</button>
        <button data-kind="rest" role="radio" title="Place rests">Rests</button>
      </div>
      <div class="figures" aria-label="Note value">
        <!-- SMuFL code points (Bravura): individual notes U+E1D2…, rests U+E4E3… -->
        <button data-dur="Whole" data-note="&#xE1D2;" data-rest="&#xE4E3;" data-name="Whole" data-key="7" class="glyph"></button>
        <button data-dur="Half" data-note="&#xE1D3;" data-rest="&#xE4E4;" data-name="Half" data-key="6" class="glyph"></button>
        <button data-dur="Quarter" data-note="&#xE1D5;" data-rest="&#xE4E5;" data-name="Quarter" data-key="5" class="glyph"></button>
        <button data-dur="Eighth" data-note="&#xE1D7;" data-rest="&#xE4E6;" data-name="Eighth" data-key="4" class="glyph"></button>
        <button data-dur="Sixteenth" data-note="&#xE1D9;" data-rest="&#xE4E7;" data-name="16th" data-key="3" class="glyph"></button>
        <button data-dur="ThirtySecond" data-note="&#xE1DB;" data-rest="&#xE4E8;" data-name="32nd" data-key="2" class="glyph"></button>
      </div>
      <button data-cmd="dot" class="wide" title="Dotted value (.)">• Dot</button>

      <h3>Accidentals</h3>
      <div class="row">
        <button data-alter="1" class="glyph" title="Sharp: applies to the previous note or the selection">&#xE262;</button>
        <button data-alter="-1" class="glyph" title="Flat: applies to the previous note or the selection">&#xE260;</button>
        <button data-alter="0" class="glyph" title="Natural: applies to the previous note or the selection">&#xE261;</button>
      </div>

      <h3>Voice</h3>
      <div class="voices" id="voices" aria-label="Voice"></div>
    </aside>

    <main id="page" class="page" tabindex="0" aria-label="Score">
      <div class="sheet">
        <div class="meta">
          <input id="title" class="title" placeholder="Title" aria-label="Title">
          <input id="composer" class="composer" placeholder="Composer" aria-label="Composer">
        </div>
        <div id="score" class="score"></div>
      </div>
    </main>
  </div>

  <footer class="status" id="status" aria-live="polite"></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
